<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arc en Ciel Business — Impression des cartes</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css?v=20260924a" />

  <!-- Garde d'accès : réservé à l'administrateur connecté. -->
  <script src="auth.js?v=20260924a"></script>
  <script>
    Auth.requireRole("admin");
  </script>

  <style>
    /* ===== Barre d'outils (écran uniquement) ===== */
    .print-toolbar {
      position: sticky; top: 0; z-index: 30;
      background: #fff; border-bottom: 1px solid var(--line);
      padding: 14px 32px; display: flex; align-items: center; justify-content: space-between; gap: 20px;
      flex-wrap: wrap;
    }
    .print-toolbar .info { font-size: 14px; color: var(--ink-600); }
    .print-toolbar .info strong { color: var(--navy); }
    .print-actions { display: flex; gap: 10px; align-items: center; }

    /* ===== Zone d'aperçu ===== */
    .preview-wrap { padding: 28px; display: flex; justify-content: center; }

    /* ===== Feuille A4 ===== */
    .sheet {
      width: 210mm; height: 296mm; overflow: hidden; background: #fff; box-shadow: var(--shadow-lg);
      padding: 2.5mm; box-sizing: border-box;
      display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 96mm;
      gap: 1.5mm; align-content: start;
    }

    /* ===== Carte ===== */
    .epargne-card {
      border: 1.5px solid #111; box-sizing: border-box; padding: 2.4mm 2.8mm;
      display: flex; flex-direction: column; gap: 1.4mm;
      font-family: 'Times New Roman', Georgia, serif; color: #111;
      overflow: hidden;
    }
    .ec-header { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 2mm; }
    .ec-logo { width: 27mm; }
    .ec-logo img { width: 100%; display: block; }
    .ec-title { text-align: left; line-height: 1.15; }
    .ec-title .t1 { font-weight: 700; font-size: 11pt; }
    .ec-title .t2 { font-size: 9.5pt; }
    .ec-title .t2 b { font-weight: 700; }
    .ec-number {
      justify-self: end; color: #d11; font-weight: 800; font-size: 12pt;
      border: 1.5px solid #d11; border-radius: 50%; padding: 1mm 2.2mm;
      min-width: 13mm; text-align: center; letter-spacing: .5px;
    }
    .ec-fields { display: flex; flex-direction: column; gap: 0.6mm; margin-top: 0.6mm; }
    .ec-line { display: flex; align-items: flex-end; font-size: 9.5pt; white-space: nowrap; }
    .ec-line .lbl { flex: 0 0 auto; }
    .ec-line .dots { flex: 1 1 auto; border-bottom: 1px dotted #555; margin-left: 2px; height: 0.9em; }
    .ec-grid {
      margin-top: auto; display: grid; grid-template-columns: repeat(5, 1fr);
      border-left: 1.2px solid #111; border-top: 1.2px solid #111;
    }
    .ec-cell {
      border-right: 1.2px solid #111; border-bottom: 1.2px solid #111;
      font-size: 9.5pt; padding: 0.6mm 1.2mm; min-height: 6.6mm; position: relative;
    }
    /* dernière cellule : 30 + 31 séparés par une diagonale */
    .ec-cell.split .n30 { position: absolute; top: 0.6mm; left: 1.2mm; }
    .ec-cell.split .n31 { position: absolute; bottom: 0.4mm; right: 1.2mm; }
    .ec-cell.split .slash {
      position: absolute; inset: 0; overflow: hidden;
    }
    .ec-cell.split .slash::after {
      content: ""; position: absolute; left: 0; bottom: 0;
      width: 142%; height: 1.2px; background: #111;
      transform-origin: left bottom; transform: rotate(-32deg);
    }

    @media print {
      @page { size: A4 portrait; margin: 0; }
      html, body { background: #fff !important; margin: 0; }
      .print-toolbar, .toast-wrap { display: none !important; }
      .preview-wrap { padding: 0; }
      .sheet { box-shadow: none; width: 210mm; height: 297mm; page-break-after: always; }
    }
  </style>
  <!-- PWA : installation Android / Desktop -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#1a2f5e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Arc en Ciel" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</head>
<body>

  <div class="print-toolbar">
    <div class="info">
      Cartes <strong id="rangeLabel">—</strong> · 6 cartes par page A4
    </div>
    <div class="print-actions">
      <a class="btn btn-ghost btn-sm" href="panneau-admin.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Retour
      </a>
      <button class="btn btn-ghost btn-sm" id="regenBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        6 nouvelles cartes
      </button>
      <button class="btn btn-gold btn-sm" id="printBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Télécharger le PDF
      </button>
    </div>
  </div>

  <div class="preview-wrap">
    <div class="sheet" id="sheet"><!-- 6 cartes injectées --></div>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="imprimer-cartes.js?v=20260924a"></script>
</body>
</html>
